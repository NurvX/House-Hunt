<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>html,body,#map{height:100%;margin:0;padding:0;}</style>
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.29/"></script>
</head>
<body>
  <div id="map"></div>
  <script>
    require(["esri/Map", "esri/views/MapView", "esri/layers/FeatureLayer", "esri/Graphic"], function(Map, MapView, FeatureLayer, Graphic) {
      const params = new URLSearchParams(location.search);
      const x = parseFloat(params.get("x"));
      const y = parseFloat(params.get("y"));

      const crosl = new FeatureLayer({
        url: "https://services.arcgis.com/xdsHIIxuCWByZiCB/arcgis/rest/services/CRoSL_Layer_N/FeatureServer/0"
      });

      const map = new Map({ basemap: "topo-vector", layers: [crosl] });

      const view = new MapView({
        container: "map",
        map: map,
        center: [x, y],
        zoom: 18
      });

      view.when(() => {
        view.graphics.add(new Graphic({
          geometry: { type: "point", longitude: x, latitude: y },
          symbol: { type: "simple-marker", color: "red", size: 12 }
        }));
      });
    });
  </script>
</body>
</html>
